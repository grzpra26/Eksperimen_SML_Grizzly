name: Automated Data Preprocessing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 🌟 TAMBAHKAN DUA BARIS INI UNTUK MEMBUKA BLOKIR 403 🌟
permissions:
  contents: write

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # (Sisa langkah di bawahnya tetap sama persis seperti kemarin...)
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    - name: Run Preprocessing Script
      run: |
        python preprocessing/automate_Grizzly_Pradipta_Singhasana_Enshito.py

    - name: Commit and Push Preprocessed Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add preprocessing/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatisasi: Update dataset hasil preprocessing terbaru" && git push)
