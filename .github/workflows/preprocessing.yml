name: Automated Data Preprocessing

# Robot akan terpantik otomatis saat kamu push ke branch main, ATAU bisa dipantik manual
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Ini memunculkan tombol "Run workflow" manual di web GitHub

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
    # Langkah 1: Ambil semua kode dari repositori GitHub kamu
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Langkah 2: Siapkan lingkungan Python sesuai versi rekomendasi Dicoding (3.12.7)
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    # Langkah 3: Install library pendukung yang dibutuhkan oleh skrip otomatisasimu
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    # Langkah 4: Jalankan skrip otomatisasi preprocessing kamu
    - name: Run Preprocessing Script
      run: |
        python preprocessing/automate_Grizzly_Pradipta_Singhasana_Enshito.py

    # Langkah 5: Simpan dan push kembali dataset bersih hasil olahan robot ke dalam repo
    - name: Commit and Push Preprocessed Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add preprocessing/
        
        # Cek jika ada perubahan file, jika ada maka lakukan commit dan push
        git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatisasi: Update dataset hasil preprocessing terbaru" && git push)
